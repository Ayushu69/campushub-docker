# x-common: &common
#   restart: unless-stopped

services:
  db:
    # <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        replicas: 1
        restart_policy: {condition: any }
        limits: { cpus: "0.50", memory: 256M }

  redis:
    # <<: *common
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        replicas: 1
        restart_policy: {condition: any }
        limits: { cpus: "0.25", memory: 128M }

  rabbitmq:
    # <<: *common
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "127.0.0.1:15672:15672"
    networks: [data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        replicas: 1
        restart_policy: {condition: any }
        limits: { cpus: "0.50", memory: 512M }

  minio:
    # <<: *common
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks: [backend, data]
    healthcheck:
      test: ["CMD-SHELL", "MC_HOST_local=http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@localhost:9000 mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        replicas: 1
        restart_policy: {condition: any }
        limits: { cpus: "0.50", memory: 512M }

  mailhog:
    # <<: *common
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:8025:8025"
    networks: [backend]
    deploy:
      resources:
        replicas: 1
        restart_policy: {condition: any }
        limits: { cpus: "0.25", memory: 64M }

  api:
    # <<: *common
    # build: ./app/api
    image: ayushuu/campus-api:1.0
    env_file: .env
    networks: [backend, data]
    # depends_on:
    #   db: { condition: service_healthy }
    #   redis: { condition: service_healthy }
    #   rabbitmq: { condition: service_healthy }
    #   minio: { condition: service_healthy }
    deploy:
      resources:
        replicas: 1
        restart_policy: {condition: any }
        limits: { cpus: "0.50", memory: 256M }

  worker:
    # <<: *common
    image: ayushuu/campus-api:1.0
    command: ["node", "src/worker.js"]
    env_file: .env
    healthcheck:
      disable: true
    networks: [backend, data]
    # depends_on:
    #   rabbitmq: { condition: service_healthy }
    #   mailhog: { condition: service_started }
    deploy:
      resources:
        replicas: 1
        restart_policy: {condition: any }
        limits: { cpus: "0.25", memory: 128M }

  frontend:
    # <<: *common
    # build: ./app/frontend
    image: ayushuu/campus-frontend:1.0
    networks: [frontend]
    deploy:
      resources:
        replicas: 1
        restart_policy: {condition: any } 
        limits: { cpus: "0.25", memory: 128M }

  gateway:
    # <<: *common
    image: nginxinc/nginx-unprivileged:1.27-alpine
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT}:8080"
    networks: [frontend, backend]
    # depends_on:
    #   frontend: { condition: service_healthy }
    #   api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        replicas: 1
        restart_policy: {condition: any }
        limits: { cpus: "0.25", memory: 128M }

volumes:
  pgdata:
  miniodata:

networks:
  frontend:
  backend:
  data: